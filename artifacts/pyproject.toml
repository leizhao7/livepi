[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "livepi-artifacts"
version = "0.1.0"
description = "Curated indirect-prompt-injection benchmark artifacts for the LivePI paper (arXiv:2605.17986)."
authors = [
  {name = "Lei Zhao", email = "leizhao7@wharton.upenn.edu"},
  {name = "Abhay Bhaskar"},
  {name = "Edgar Dobriban", email = "dobriban@wharton.upenn.edu"},
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage"   = "https://leizhao7.github.io/livepi/"
"Paper"      = "https://arxiv.org/abs/2605.17986"
"Repository" = "https://github.com/leizhao7/livepi"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["livepi_artifacts*"]

[tool.setuptools.package-data]
livepi_artifacts = ["data/**/*.json"]
